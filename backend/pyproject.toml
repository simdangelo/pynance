[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynance"
version = "0.1.0"
description = "Pynance - a personal finance tracking application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.135",
    "httpx>=0.28",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.hatch.build.targets.wheel]
packages = ["pynance"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
