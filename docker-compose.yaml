services:
  db:
    image: postgres:17
    container_name: pynance_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      app:
        ipv4_address: 172.20.0.2

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECURE_COOKIES: "true"
      ALLOWED_HOSTS: '["${DOMAIN:-localhost}", "localhost", "127.0.0.1"]'
      FORWARDED_ALLOW_IPS: "172.20.0.5"
    depends_on:
      db:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.20.0.3

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    profiles: ["bot"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    command: ["uv", "run", "python", "-m", "pynance.bot.main"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.20.0.4

  proxy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      app:
        ipv4_address: 172.20.0.5

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  postgres_data:
  caddy_data:
  caddy_config: