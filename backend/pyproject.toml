[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynance"
version = "0.1.0"
description = "Pynance - a personal finance tracking application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["pynance"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
